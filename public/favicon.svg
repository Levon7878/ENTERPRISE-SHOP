    <path d="M18 18h28a3 3 0 0 1 0 6H24v5h18a3 3 0 0 1 0 6H24v5h22a3 3 0 0 1 0 6H18a3 3 0 0 1-3-3V21a3 3 0 0 1 3-3z"/>
  </g>

  <!-- Spark accent (like header Sparkles) -->
  <g fill="#FDE68A">
    <path d="M47.5 14.5l1.15 2.85 2.85 1.15-2.85 1.15-1.15 2.85-1.15-2.85-2.85-1.15 2.85-1.15z"/>
  </g>
  <circle cx="42" cy="21" r="1.4" fill="#93C5FD" opacity="0.95"/>
